<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>穷玩车富玩表 顶富就玩黑客快跑</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #gameCanvas {
      position: fixed; inset: 0;
      display: block;
      width: 100%; height: 100%;
    }
    /* 标题页 */
    #titleScreen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      z-index: 20;
      background: radial-gradient(ellipse at 50% 30%, #0a003a 0%, #020010 60%, #000000 100%);
    }
    .title-main {
      font-size: clamp(1.8rem, 7vw, 3rem);
      font-weight: 900;
      color: #00f7ff;
      text-align: center;
      line-height: 1.3;
      text-shadow: 0 0 8px #00f7ff, 0 0 20px #00f7ff, 0 0 45px #007fff;
    }
    #btnStart {
      padding: clamp(0.7rem, 2.5vh, 1rem) clamp(2rem, 8vw, 3.5rem);
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 900;
      color: #000010;
      background: linear-gradient(135deg, #00f7ff 0%, #8866ff 100%);
      border: none; border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 20px #00f7ff, 0 0 40px #6644ff;
      animation: btnPulse 2s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 0 20px #00f7ff, 0 0 40px #6644ff; }
      50%      { box-shadow: 0 0 40px #00f7ff, 0 0 80px #6644ff, 0 0 120px #0040ff; }
    }
    /* 死亡页 */
    #deathScreen {
      position: fixed; inset: 0;
      background: #000;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
    }
    #deathScreen.show { display: flex; }
    .death-char {
      font-size: min(55vw, 52vh);
      font-weight: 900;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000, 0 0 50px #ff0000, 0 0 100px #880000;
      animation: caiAnim 0.4s ease-in-out infinite alternate;
    }
    @keyframes caiAnim {
      from { transform: scale(1) rotate(-1.5deg); }
      to   { transform: scale(1.06) rotate(1.5deg); }
    }
    .death-score {
      font-size: clamp(0.9rem, 3.5vw, 1.3rem);
      color: #ff4444;
      margin-top: 1rem;
      text-shadow: 0 0 10px #ff2222;
    }
    #btnRestart {
      margin-top: 1.5rem;
      padding: clamp(0.6rem, 2vh, 0.9rem) clamp(1.5rem, 7vw, 2.8rem);
      font-size: clamp(0.85rem, 3.5vw, 1.15rem);
      font-weight: bold;
      color: #ff2222;
      background: transparent;
      border: 2px solid #ff2222;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 12px #ff0000;
    }
    /* 大招按钮 */
    #btnUltimate {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 3px solid #333;
      background: #111;
      color: #555;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 15;
      transition: all 0.2s;
      pointer-events: none;
    }
    #btnUltimate.active {
      border-color: #00f7ff;
      background: linear-gradient(135deg, #00f7ff 0%, #8866ff 100%);
      color: #000;
      box-shadow: 0 0 20px #00f7ff, 0 0 40px #6644ff;
      pointer-events: auto;
      animation: ultPulse 1s ease-in-out infinite;
    }
    @keyframes ultPulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    /* 能量条 */
    #energyBar {
      position: fixed;
      bottom: 20px; left: 20px;
      width: 150px; height: 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      z-index: 15;
      overflow: hidden;
    }
    #energyFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f7ff 0%, #8866ff 100%);
      transition: width 0.2s;
      box-shadow: 0 0 10px #00f7ff;
    }
  </style>
</head>
<body>
<div id="titleScreen">
  <div class="title-main">穷玩车富玩表<br>顶富就玩黑客快跑</div>
  <button id="btnStart" onclick="startGame()">开始游戏</button>
</div>

<div id="deathScreen">
  <div class="death-char">菜</div>
  <div class="death-score" id="deathScoreText">得分: 0</div>
  <button id="btnRestart" onclick="restartGame()">再来一次</button>
</div>

<!-- 大招UI -->
<div id="energyBar"><div id="energyFill"></div></div>
<button id="btnUltimate" onclick="useUltimate()">神拳</button>

<canvas id="gameCanvas"></canvas>

<script>
'use strict';
// 全局配置（东方标准难度）
const CFG = {
  PLAYER_HP: 3,
  PLAYER_VISUAL_RATIO: 0.042, // 玩家视觉大小
  PLAYER_HITBOX_RATIO: 0.008, // ✅ 东方式极小判定点（只有中心白点）
  PLAYER_LERP: 0.15,
  PLAYER_FIRE_RATE: 0.12,
  PLAYER_BULLET_SPEED: 0.65,
  PLAYER_BULLET_DMG: 1,
  ENEMY_BULLET_SPEED_BASE: 0.22, // ✅ 弹幕速度恢复正常
  BULLET_RADIUS_RATIO: 0.011,
  ENEMY_SPEED_BASE: 0.10,
  ENEMY_SPAWN_CD: 1.2, // ✅ 刷怪间隔拉长
  ENEMY_SPAWN_CD_MIN: 0.4,
  BOSS_SCORE_INTERVAL: 500,
  BOSS_HP_BASE: 70,
  DIFF_INTERVAL: 20, // ✅ 难度提升变慢
  DIFF_MAX: 25,
  // 大招配置
  ULTIMATE_ENERGY_MAX: 100,
  ULTIMATE_DAMAGE: 50,
  ULTIMATE_INVINCIBLE: 2.0
};

// 预加载自定义贴图
const IMGS = {};
['boss', 'player', 'enemy1', 'enemy2', 'enemy3', 'bg', 'bulletPlayer', 'bulletEnemy'].forEach(key => {
  const img = new Image();
  img.onload = () => { IMGS[key] = img; };
  img.onerror = () => { IMGS[key] = null; };
  img.src = `./${key}.png`;
});

// 画布初始化
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// 工具函数
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

// 游戏状态
const STATE = { TITLE: 0, PLAYING: 1, DEAD: 2 };
let gameState = STATE.TITLE;

// 全局变量
let player, bullets, enemies, particles, activeBoss;
let score, diffLevel, gameTime, spawnTimer, nextBossScore;
let energy = 0;
let isInvincible = false;
let lastTime = 0, animId = null;
const touchTarget = { x: W * 0.5, y: H * 0.78 };

// 规律刷怪模式（6种循环，密度减半）
const SPAWN_PATTERNS = [
  { name: 'line', enemies: Array(4).fill('grunt'), positions: (w) => [w*0.2, w*0.4, w*0.6, w*0.8], delay: 0 },
  { name: 'vshape', enemies: Array(5).fill('fast'), positions: (w) => [w*0.15, w*0.3, w*0.5, w*0.7, w*0.85], delay: 0.2 },
  { name: 'cross', enemies: Array(6).fill('grunt'), positions: (w) => [w*0.25, w*0.75, w*0.35, w*0.65, w*0.45, w*0.55], delay: 0.25 },
  { name: 'tank_guard', enemies: ['grunt', 'tank', 'grunt'], positions: (w) => [w*0.3, w*0.5, w*0.7], delay: 0.15 },
  { name: 'circle', enemies: Array(7).fill('fast'), positions: (w) => [w*0.15, w*0.28, w*0.4, w*0.5, w*0.6, w*0.72, w*0.85], delay: 0.1 },
  { name: 'dense', enemies: Array(8).fill('grunt'), positions: (w) => [w*0.15, w*0.28, w*0.4, w*0.5, w*0.6, w*0.72, w*0.85, w*0.5], delay: 0.1 }
];
let currentPatternIndex = 0;

// 粒子类
class Particle {
  constructor(x, y, c) {
    this.x = x; this.y = y; this.c = c;
    this.dx = rnd(-1, 1) * 80;
    this.dy = rnd(-1, 1) * 80;
    this.life = rnd(0.4, 0.8);
  }
  update(dt) {
    this.x += this.dx * dt;
    this.y += this.dy * dt;
    this.life -= dt;
  }
  draw() {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.c;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// 子弹类
class Bullet {
  constructor(x, y, dx, dy, o, c, r) {
    this.x = x; this.y = y;
    this.dx = dx; this.dy = dy;
    this.o = o; this.c = c;
    this.r = r || CFG.BULLET_RADIUS_RATIO * W;
    this.active = true;
  }
  update(dt) {
    this.x += this.dx * dt;
    this.y += this.dy * dt;
    if (this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30)
      this.active = false;
  }
  draw() {
    ctx.fillStyle = this.c;
    ctx.shadowColor = this.c;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// 玩家类（✅ 东方判定点机制）
class Player {
  constructor() {
    this.x = W * 0.5;
    this.y = H * 0.78;
    this.visualR = CFG.PLAYER_VISUAL_RATIO * W; // 视觉大小
    this.hitboxR = CFG.PLAYER_HITBOX_RATIO * W; // 实际判定点大小（极小）
    this.hp = CFG.PLAYER_HP;
    this.fireTimer = 0;
  }
  update(dt) {
    this.x += (touchTarget.x - this.x) * CFG.PLAYER_LERP;
    this.y += (touchTarget.y - this.y) * CFG.PLAYER_LERP;
    this.x = clamp(this.x, this.visualR, W - this.visualR);
    this.y = clamp(this.y, this.visualR, H - this.visualR);
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fire();
      this.fireTimer = CFG.PLAYER_FIRE_RATE;
    }
  }
  fire() {
    const spd = CFG.PLAYER_BULLET_SPEED * H;
    const cols = diffLevel >= 10 ? 5 : diffLevel >= 6 ? 3 : diffLevel >= 2 ? 2 : 1;
    const offsets = { 1: [0], 2: [-12, 12], 3: [-18, 0, 18], 5: [-28, -14, 0, 14, 28] }[cols];
    offsets.forEach(ox => {
      bullets.push(new Bullet(
        this.x + ox, this.y - this.visualR,
        ox * 0.03 * spd, -spd,
        'player', '#00ffff'
      ));
    });
  }
  takeDamage(dmg) {
    if (isInvincible) return;
    this.hp -= dmg;
    spawnParticles(this.x, this.y, '#ff4455', 10);
    if (this.hp <= 0) showDead();
  }
  draw() {
    // 无敌闪烁
    if (isInvincible && Math.floor(Date.now() * 0.015) % 2 === 0) return;
    
    // 绘制玩家本体
    if (IMGS.player) {
      ctx.save();
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 15;
      ctx.drawImage(IMGS.player, this.x - this.visualR, this.y - this.visualR, this.visualR*2, this.visualR*2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.visualR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // ✅ 绘制东方式白色判定点（中心白点）
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.hitboxR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// 敌人类（✅ 弹幕数量减半）
class Enemy {
  constructor(type, x) {
    this.type = type;
    this.x = x;
    this.y = -20;
    this.r = type === 'fast' ? 9 : type === 'tank' ? 16 : 11;
    this.hp = type === 'fast' ? 2 : type === 'tank' ? 20 : 3;
    this.speed = type === 'fast' ? 2.2 : type === 'tank' ? 0.55 : 1.1;
    this.color = type === 'fast' ? '#bb44ff' : type === 'tank' ? '#ff8800' : '#ff3355';
    this.active = true;
    this.fireTimer = rnd(0.8, 1.5);
    this.movePhase = 0;
  }
  update(dt) {
    this.y += this.speed * 60 * dt;
    this.movePhase += dt * 2;
    if (this.type === 'fast') {
      this.x += Math.sin(this.movePhase * 2.5) * 1.5;
    }
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.shoot();
      this.fireTimer = rnd(1.2, 2.0);
    }
    if (this.y > H + 20) this.active = false;
  }
  shoot() {
    const spd = CFG.ENEMY_BULLET_SPEED_BASE * H;
    if (this.type === 'fast') {
      // ✅ 快速怪：3向弹（原5向）
      [-0.25, 0, 0.25].forEach(da => {
        bullets.push(new Bullet(
          this.x, this.y,
          Math.cos(Math.PI/2 + da) * spd,
          Math.sin(Math.PI/2 + da) * spd,
          'enemy', this.color
        ));
      });
    } else if (this.type === 'tank') {
      // ✅ 坦克怪：4向扇形弹（原7向）
      for (let i = -1; i <= 1; i++) {
        bullets.push(new Bullet(
          this.x, this.y,
          i * 35, spd * 0.8,
          'enemy', this.color
        ));
      }
    } else {
      // ✅ 普通怪：2向弹（原3向）
      [-0.15, 0.15].forEach(da => {
        bullets.push(new Bullet(
          this.x, this.y,
          Math.cos(Math.PI/2 + da) * spd,
          Math.sin(Math.PI/2 + da) * spd,
          'enemy', this.color
        ));
      });
    }
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.active = false;
      score += this.type === 'tank' ? 60 : this.type === 'fast' ? 20 : 10;
      energy += this.type === 'tank' ? 12 : this.type === 'fast' ? 6 : 4;
      updateEnergyUI();
      spawnParticles(this.x, this.y, this.color, 12);
    }
  }
  draw() {
    const imgKey = this.type === 'fast' ? 'enemy2' : this.type === 'tank' ? 'enemy3' : 'enemy1';
    if (IMGS[imgKey]) {
      ctx.save();
      ctx.shadowColor = this.color; ctx.shadowBlur = 10;
      ctx.drawImage(IMGS[imgKey], this.x - this.r, this.y - this.r, this.r*2, this.r*2);
      ctx.restore();
    } else {
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

// BOSS类（✅ 弹幕数量大幅减少）
class Boss {
  constructor() {
    this.x = W * 0.5;
    this.y = -100;
    this.targetY = H * 0.18;
    this.r = 0.14 * W;
    this.hp = CFG.BOSS_HP_BASE + diffLevel * 20;
    this.maxHp = this.hp;
    this.active = true;
    this.fireTimer = 1.5;
    this.entered = false;
    this.moveDir = 1;
    this.attackIndex = 0;
    this.angle = 0;
  }
  update(dt) {
    this.angle += dt * 3;
    if (!this.entered) {
      this.y += 100 * dt;
      if (this.y >= this.targetY) {
        this.y = this.targetY;
        this.entered = true;
      }
      return;
    }
    this.x += this.moveDir * 55 * dt;
    if (this.x > W * 0.82 || this.x < W * 0.18) this.moveDir *= -1;
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.doAttack();
      this.fireTimer = this.hp < this.maxHp * 0.5 ? 0.7 : 1.0;
      this.attackIndex = (this.attackIndex + 1) % 5;
    }
  }
  doAttack() {
    const spd = CFG.ENEMY_BULLET_SPEED_BASE * H;
    const r1 = this.r * 0.7;
    const px = player.x, py = player.y;

    switch (this.attackIndex) {
      // 攻击1：双螺旋弹幕
      case 0: {
        const arms = this.hp < this.maxHp * 0.5 ? 6 : 4;
        for (let i = 0; i < arms; i++) {
          const a = this.angle + (i/arms)*Math.PI*2;
          bullets.push(new Bullet(
            this.x + Math.cos(a)*r1, this.y + Math.sin(a)*r1,
            Math.cos(a)*spd, Math.sin(a)*spd,
            'enemy', '#ffee00'
          ));
        }
        break;
      }
      // 攻击2：全向圆弹
      case 1: {
        const n = this.hp < this.maxHp * 0.5 ? 16 : 12;
        for (let i = 0; i < n; i++) {
          const a = (i/n) * Math.PI*2 + this.angle*0.3;
          bullets.push(new Bullet(
            this.x, this.y,
            Math.cos(a)*spd*0.75, Math.sin(a)*spd*0.75,
            'enemy', '#ff00ff'
          ));
        }
        break;
      }
      // 攻击3：密集瞄准弹幕
      case 2: {
        const count = this.hp < this.maxHp * 0.5 ? 7 : 5;
        const base = Math.atan2(py - this.y, px - this.x);
        for (let i = 0; i < count; i++) {
          const a = base + (i - Math.floor(count/2)) * 0.15;
          bullets.push(new Bullet(
            this.x, this.y,
            Math.cos(a)*spd*1.0, Math.sin(a)*spd*1.0,
            'enemy', '#ff4444'
          ));
        }
        break;
      }
      // 攻击4：交叉弹幕
      case 3: {
        for (let i = 0; i < 7; i++) {
          const x = W * (0.15 + i * 0.1);
          bullets.push(new Bullet(x, this.y, 25, spd, 'enemy', '#00ffff'));
          bullets.push(new Bullet(W - x, this.y, -25, spd, 'enemy', '#00ffff'));
        }
        break;
      }
      // 攻击5：落幕帘弹
      case 4: {
        const cols = this.hp < this.maxHp * 0.5 ? 14 : 10;
        for (let i = 0; i < cols; i++) {
          const bx = (i / (cols-1)) * W;
          bullets.push(new Bullet(bx, this.y, 0, spd*0.85, 'enemy', '#ff88ff'));
        }
        break;
      }
    }
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.hp = 0;
      this.active = false;
      score += 200 + diffLevel * 50;
      energy += 50;
      updateEnergyUI();
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          spawnParticles(this.x + rnd(-30,30), this.y + rnd(-30,30),
            i%2 ? '#ff00ff' : '#ffee00', 20);
        }, i * 80);
      }
    }
  }
  draw() {
    if (IMGS.boss) {
      ctx.save();
      ctx.shadowColor = this.hp < this.maxHp * 0.5 ? '#ff00ff' : '#ff8800';
      ctx.shadowBlur = 35;
      ctx.drawImage(IMGS.boss, this.x - this.r, this.y - this.r, this.r*2, this.r*2);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(this.x, this.y);
      ctx.shadowColor = this.hp < this.maxHp * 0.5 ? '#ff00ff' : '#ff8800';
      ctx.shadowBlur = 30;
      // 旋转光环
      const n = this.hp < this.maxHp * 0.5 ? 10 : 6;
      for (let i = 0; i < n; i++) {
        const a = (i/n)*Math.PI*2 + this.angle*0.4;
        ctx.save();
        ctx.rotate(a);
        ctx.fillStyle = this.hp < this.maxHp * 0.5 ? '#ff00ff' : '#ff8800';
        ctx.globalAlpha = 0.6;
        ctx.fillRect(-this.r*0.08, -this.r*1.1, this.r*0.16, this.r*0.3);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = this.hp < this.maxHp * 0.5 ? '#660044' : '#663300';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 - Math.PI/2;
        const r = i%2 === 0 ? this.r : this.r * 0.65;
        i===0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r)
              : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
      const g = ctx.createRadialGradient(0,0,0, 0,0,this.r*0.6);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.3, this.hp < this.maxHp * 0.5 ? '#ff00ff' : '#ff8800');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, this.r*0.58, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    this._drawHPBar();
  }
  _drawHPBar() {
    const bw = W * 0.75, bh = 12;
    const bx = (W - bw) * 0.5, by = H * 0.015;
    ctx.fillStyle = 'rgba(10,0,20,0.9)';
    ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
    ctx.strokeStyle = this.hp < this.maxHp * 0.5 ? '#ff00ff' : '#ff8800';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 3, by - 3, bw + 6, bh + 6);
    ctx.fillStyle = '#1a0010';
    ctx.fillRect(bx, by, bw, bh);
    const ratio = this.hp / this.maxHp;
    const hpGrad = ctx.createLinearGradient(bx, 0, bx+bw, 0);
    if (this.hp < this.maxHp * 0.5) {
      hpGrad.addColorStop(0, '#ff0055'); hpGrad.addColorStop(1, '#ff00ff');
    } else {
      hpGrad.addColorStop(0, '#ff4400'); hpGrad.addColorStop(1, '#ffaa00');
    }
    ctx.fillStyle = hpGrad;
    ctx.fillRect(bx, by, bw * ratio, bh);
    ctx.save();
    ctx.shadowColor = this.hp < this.maxHp * 0.5 ? '#ff00ff' : '#ff8800';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${clamp(10,W*0.032,16)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`BOSS ${this.hp < this.maxHp * 0.5 ? '【狂暴】' : ''}`, W*0.5, by + bh*0.85);
    ctx.restore();
  }
}

function spawnParticles(x, y, c, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, c));
  }
}

function updateEnergyUI() {
  energy = clamp(energy, 0, CFG.ULTIMATE_ENERGY_MAX);
  document.getElementById('energyFill').style.width = `${(energy / CFG.ULTIMATE_ENERGY_MAX) * 100}%`;
  if (energy >= CFG.ULTIMATE_ENERGY_MAX) {
    document.getElementById('btnUltimate').classList.add('active');
  } else {
    document.getElementById('btnUltimate').classList.remove('active');
  }
}

function useUltimate() {
  if (energy < CFG.ULTIMATE_ENERGY_MAX || gameState !== STATE.PLAYING) return;
  energy = 0;
  updateEnergyUI();
  // 清屏
  bullets = bullets.filter(b => b.o === 'player');
  // 全场伤害
  enemies.forEach(e => e.takeDamage(CFG.ULTIMATE_DAMAGE));
  if (activeBoss && activeBoss.active) activeBoss.takeDamage(CFG.ULTIMATE_DAMAGE);
  // 特效
  spawnParticles(W/2, H/2, '#00ffff', 60);
  spawnParticles(W/2, H/2, '#8866ff', 60);
  // 无敌
  isInvincible = true;
  setTimeout(() => { isInvincible = false; }, CFG.ULTIMATE_INVINCIBLE * 1000);
}

// ✅ 碰撞检测只检测极小判定点
function checkCollisions() {
  bullets.forEach(b => {
    if (!b.active || b.o !== 'player') return;
    enemies.forEach(e => {
      if (e.active && dist2(b.x, b.y, e.x, e.y) < (b.r + e.r) ** 2) {
        b.active = false;
        e.takeDamage(b.dmg || 1);
      }
    });
    if (activeBoss && activeBoss.active && dist2(b.x, b.y, activeBoss.x, activeBoss.y) < (b.r + activeBoss.r) ** 2) {
      b.active = false;
      activeBoss.takeDamage(b.dmg || 1);
    }
  });
  bullets.forEach(b => {
    if (!b.active || b.o !== 'enemy') return;
    // ✅ 只和玩家中心的极小判定点碰撞
    if (dist2(b.x, b.y, player.x, player.y) < (b.r + player.hitboxR) ** 2) {
      b.active = false;
      player.takeDamage(1);
    }
  });
  enemies.forEach(e => {
    if (e.active && dist2(e.x, e.y, player.x, player.y) < (e.r + player.hitboxR * 2) ** 2) {
      e.active = false;
      spawnParticles(e.x, e.y, e.color, 12);
      player.takeDamage(1);
    }
  });
}

// 规律刷怪系统
function updateSpawner(dt) {
  gameTime += dt;
  diffLevel = Math.min(Math.floor(gameTime / CFG.DIFF_INTERVAL), CFG.DIFF_MAX);
  
  // BOSS触发
  if (!activeBoss && score >= nextBossScore) {
    activeBoss = new Boss();
    nextBossScore += CFG.BOSS_SCORE_INTERVAL + diffLevel * 100;
    enemies.length = 0;
    bullets = bullets.filter(b => b.o === 'player');
    currentPatternIndex = 0;
    return;
  }
  if (activeBoss && !activeBoss.active) activeBoss = null;
  if (activeBoss) return;

  // 按固定模式循环刷怪
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const pattern = SPAWN_PATTERNS[currentPatternIndex];
    const positions = pattern.positions(W);
    
    pattern.enemies.forEach((type, i) => {
      setTimeout(() => {
        if (gameState !== STATE.PLAYING || activeBoss) return;
        enemies.push(new Enemy(type, positions[i]));
      }, i * pattern.delay * 1000);
    });

    currentPatternIndex = (currentPatternIndex + 1) % SPAWN_PATTERNS.length;
    
    const cd = Math.max(CFG.ENEMY_SPAWN_CD_MIN, 
                       CFG.ENEMY_SPAWN_CD - diffLevel * 0.03);
    spawnTimer = cd;
  }
}

function drawBackground(dt) {
  if (IMGS.bg) {
    let bgScrollY = (bgScrollY + 50 * dt) % H;
    ctx.globalAlpha = 0.4;
    ctx.drawImage(IMGS.bg, 0, bgScrollY - H, W, H);
    ctx.drawImage(IMGS.bg, 0, bgScrollY, W, H);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = '#010012';
    ctx.fillRect(0, 0, W, H);
    // 动态星空
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 60; i++) {
      const x = (i * 73 + gameTime * 12) % W;
      const y = (i * 47 + gameTime * 30) % H;
      ctx.globalAlpha = 0.25 + Math.sin(gameTime * 2 + i) * 0.2;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}

function drawHUD() {
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 18px monospace';
  ctx.fillText(`得分: ${score}`, 15, 55);
  ctx.fillText(`波次: ${diffLevel + 1}`, 15, 80);
  // 血量
  ctx.fillStyle = '#ff3344';
  ctx.font = '22px serif';
  let hpText = '';
  for (let i = 0; i < player.hp; i++) hpText += '♥ ';
  ctx.fillText(hpText, 15, 110);
}

function gameLoop(ts) {
  if (gameState !== STATE.PLAYING) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.04);
  lastTime = ts;
  
  updateSpawner(dt);
  player.update(dt);
  if (activeBoss && activeBoss.active) activeBoss.update(dt);
  enemies.forEach(e => e.update(dt));
  bullets.forEach(b => b.update(dt));
  particles.forEach(p => p.update(dt));
  
  enemies = enemies.filter(e => e.active);
  bullets = bullets.filter(b => b.active);
  particles = particles.filter(p => p.life > 0);
  
  checkCollisions();
  
  drawBackground(dt);
  if (activeBoss && activeBoss.active) activeBoss.draw();
  enemies.forEach(e => e.draw());
  bullets.forEach(b => b.draw());
  particles.forEach(p => p.draw());
  player.draw();
  drawHUD();
  
  animId = requestAnimationFrame(gameLoop);
}

function initGame() {
  resizeCanvas();
  touchTarget.x = W * 0.5;
  touchTarget.y = H * 0.78;
  player = new Player();
  bullets = [];
  enemies = [];
  particles = [];
  activeBoss = null;
  score = 0;
  diffLevel = 0;
  gameTime = 0;
  spawnTimer = 1.2;
  nextBossScore = CFG.BOSS_SCORE_INTERVAL;
  energy = 0;
  isInvincible = false;
  currentPatternIndex = 0;
  updateEnergyUI();
  document.getElementById('energyBar').style.display = 'block';
  document.getElementById('btnUltimate').style.display = 'block';
}

function startGame() {
  document.getElementById('titleScreen').style.display = 'none';
  gameState = STATE.PLAYING;
  initGame();
  lastTime = performance.now();
  animId = requestAnimationFrame(gameLoop);
}

function showDead() {
  gameState = STATE.DEAD;
  cancelAnimationFrame(animId);
  document.getElementById('deathScoreText').textContent = `最终得分：${score} | 第 ${diffLevel + 1} 波`;
  document.getElementById('deathScreen').classList.add('show');
  document.getElementById('energyBar').style.display = 'none';
  document.getElementById('btnUltimate').style.display = 'none';
}

function restartGame() {
  document.getElementById('deathScreen').classList.remove('show');
  gameState = STATE.PLAYING;
  initGame();
  lastTime = performance.now();
  animId = requestAnimationFrame(gameLoop);
}

// 输入系统
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  touchTarget.x = e.touches[0].clientX;
  touchTarget.y = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('mousemove', (e) => {
  touchTarget.x = e.clientX;
  touchTarget.y = e.clientY;
});

// 初始隐藏UI
document.getElementById('energyBar').style.display = 'none';
document.getElementById('btnUltimate').style.display = 'none';
let bgScrollY = 0;
</script>
</body>
